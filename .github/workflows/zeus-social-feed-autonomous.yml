name: ZEUS Social Feed — Quarantined Legacy Payload

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quarantine-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert legacy payload remains blocked
        shell: bash
        run: |
          set -euo pipefail
          FILE='ops/social/payloads/ang-travel-feed-authorized-2026-08-27.json'
          jq -e '.action == "blocked_no_publish"' "$FILE" >/dev/null
          jq -e '.publication_gate.prohibited == true and .publication_gate.approval_state == "REVOKED" and .publication_gate.fail_closed == true' "$FILE" >/dev/null
          jq -e '(.payload.image_url // "") == "" and (.payload.caption // "") == ""' "$FILE" >/dev/null
          echo "Legacy CURADORIA_ANG_AGOSTO payload is quarantined. No publication action exists in this workflow."
