name: ZEUS Social V5 Feed — Quarantined Legacy Payload

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quarantine-proof:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
      - name: Enforce zero-duplication preflight
        shell: pwsh
        run: |
          ./scripts/social-dedupe-preflight.ps1 `
            -QueuePath '.\ops\social\zeus-social-dispatch-queue-2026-08-27.json'
      - name: No dispatch path
        shell: pwsh
        run: |
          throw 'Legacy queue unexpectedly passed quarantine; publication remains disabled.'
