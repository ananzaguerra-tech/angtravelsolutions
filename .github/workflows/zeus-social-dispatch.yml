name: Zeus social dispatch

on:
  workflow_dispatch:
  push:
    branches:
      - recovery/v13-staging-2026-08-17
    paths:
      - 'ops/social/zeus-social-dispatch-queue-*.json'
      - '.github/workflows/zeus-social-dispatch.yml'

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    env:
      ZEUS_SOCIAL_WEBHOOK: ${{ secrets.ZEUS_SOCIAL_WEBHOOK }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve latest queue
        id: queue
        shell: bash
        run: |
          set -euo pipefail
          FILE=$(ls -1 ops/social/zeus-social-dispatch-queue-*.json | sort | tail -n 1)
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          jq -e '.items | length > 0' "$FILE" >/dev/null
          jq -e '[.items[] | select(.publish_authorized == true and .status == "READY_TO_DISPATCH")] | length > 0' "$FILE" >/dev/null

      - name: Validate Zeus endpoint availability
        id: endpoint
        shell: bash
        run: |
          if [ -z "${ZEUS_SOCIAL_WEBHOOK:-}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "ZEUS_SOCIAL_WEBHOOK is not configured. No external publication attempted."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch authorized queue to Zeus/n8n
        if: ${{ steps.endpoint.outputs.available == 'true' }}
        env:
          QUEUE_FILE: ${{ steps.queue.outputs.file }}
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD=$(jq '{source, policy, items: [.items[] | select(.publish_authorized == true and .status == "READY_TO_DISPATCH")]}' "$QUEUE_FILE")
          RESPONSE=$(curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 3 \
            -H 'Content-Type: application/json' \
            -H 'X-ANG-Source: github-actions' \
            --data "$PAYLOAD" \
            "$ZEUS_SOCIAL_WEBHOOK")
          echo "$RESPONSE" | jq . || printf '%s\n' "$RESPONSE"

      - name: Publication evidence requirement
        shell: bash
        run: |
          if [ "${{ steps.endpoint.outputs.available }}" = "true" ]; then
            echo "Dispatch attempted. Zeus/n8n must return/store real platform permalink or post ID per item before any item is marked PUBLISHED."
          else
            echo "Dispatch blocked safely because the Zeus endpoint secret is absent. Queue remains READY_TO_DISPATCH."
          fi
